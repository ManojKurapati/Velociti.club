server {
  listen 80;
  listen 443 ssl;
  server_name velociti.club www.velociti.club;
  # ssl_certificate ...; ssl_certificate_key ...;
  location = /case-studies { return 301 https://thinkvelociti.com/customers$is_args$args; }
  location = /blog { return 301 https://thinkvelociti.com/insights$is_args$args; }
  location = /enterprise { return 301 https://thinkvelociti.com/solutions$is_args$args; }
  location = /ai-fy { return 301 https://thinkvelociti.com/solutions$is_args$args; }
  location = /knowledge { return 301 https://thinkvelociti.com/insights$is_args$args; }
  location = /the-club { return 301 https://thinkvelociti.com/about$is_args$args; }
  location = /curious { return 301 https://thinkvelociti.com/contact$is_args$args; }
  location = /startups { return 301 https://thinkvelociti.com/contact$is_args$args; }
  location = /about { return 301 https://thinkvelociti.com/about$is_args$args; }
  location / { return 301 https://thinkvelociti.com$request_uri; }
}

# Canonical host: www.thinkvelociti.com -> thinkvelociti.com
server {
  listen 80;
  listen 443 ssl;
  server_name www.thinkvelociti.com;
  return 301 https://thinkvelociti.com$request_uri;
}
